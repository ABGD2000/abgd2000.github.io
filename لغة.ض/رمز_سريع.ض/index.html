			$الوحدات[9][$عدد_الوحدات-رقم_البتة] = قيمة_الوحدة 
		إذا رقم_البتة = 8
			$الوحدات[9][8] = قيمة_الوحدة 
		لا 
			$الوحدات[9][15-رقم_البتة] = قيمة_الوحدة 
		تم 
	دور 
	$الوحدات[$عدد_الوحدات-7][9] = (! اختبار)
	
# يكتب الكلمات المشفّرة في الرمز.
دالة خريطة_البيانات(البيانات, نمط_القناع)

	اتجاه_الصف = -1
	الصف = $عدد_الوحدات-1
	فهرس_البتة = 7
	فهرس_البايت = 1
	طول_البيانات_عدد = len(البيانات)
	العمود = $عدد_الوحدات-1
	كلما العمود > 0
		لو العمود = 6 العمود -= 1 تم 
		كلما 1 
			من إزاحة_العمود = 0 إلى 1
				لو isnull($الوحدات[الصف+1][العمود-إزاحة_العمود+1])
					داكنة = 0 
					لو فهرس_البايت <= طول_البيانات_عدد 
						داكنة = ((البيانات[فهرس_البايت]>>فهرس_البتة)&1) = 1
					تم 
					لو دالة_القناع(نمط_القناع, الصف, العمود-إزاحة_العمود) داكنة = ! داكنة تم 
					$الوحدات[الصف+1][العمود-إزاحة_العمود+1] = داكنة 
					فهرس_البتة--
					لو فهرس_البتة = -1 فهرس_البايت++فهرس_البتة = 7 تم 
				تم 
			دور 
			الصف += اتجاه_الصف 
			لو الصف < 0 || الصف >= $عدد_الوحدات 
				الصف -= اتجاه_الصف 
				اتجاه_الصف = -اتجاه_الصف 
				خرج 
			تم 
		تمام 
		العمود -= 2
	تمام 
	
# مجرى الكلمات المشفّرة النهائي.
دالة إنشاء_البيانات(رقم_الإصدار_المطلوب, مستوى_الأخطاء)

	كتل_rs = كتل_رييد_سولومون(رقم_الإصدار_المطلوب, مستوى_الأخطاء)
	المخزن = مخزن_بتات_جديد()
	من مدخل_البيانات في $قائمة_البيانات 
		وضع_القيمة(المخزن, مدخل_البيانات[1], 4)
		وضع_القيمة(المخزن, طول_البيانات(مدخل_البيانات[2], مدخل_البيانات[3], رقم_الإصدار_المطلوب), طول_البتات(مدخل_البيانات[1], رقم_الإصدار_المطلوب))
		كتابة_البيانات(المخزن, مدخل_البيانات[3], مدخل_البيانات[2])
	دور 
	سعة_البيانات = sumlist(map(كتل_rs, دالة كتلة { مرر كتلة[2]}))
	لو طول_المخزن(المخزن) > سعة_البيانات*8 مرر [] تم 
	لو طول_المخزن(المخزن)+4 <= سعة_البيانات*8 وضع_القيمة(المخزن, 0, 4) تم 
	كلما طول_المخزن(المخزن)%8 != 0 وضع_بتة(المخزن, 0) تمام 
	كلما 1 
		لو طول_المخزن(المخزن) >= سعة_البيانات*8 خرج تم 
		وضع_القيمة(المخزن, $حشو0, 8)
		لو طول_المخزن(المخزن) >= سعة_البيانات*8 خرج تم 
		وضع_القيمة(المخزن, $حشو1, 8)
	تمام 
	مرر إنشاء_البايتات(المخزن, كتل_rs)
	
# يضرب كثيرَي حدود في GF(256).
دالة ضرب_كثيرات_الحدود(كثير1, كثير2)

	طول1 = len(كثير1)
	طول2 = len(كثير2)
	الناتج = list(طول1+طول2-1)
	من موقع1 = 1 إلى طول1 
		من موقع2 = 1 إلى طول2 
			الناتج[موقع1+موقع2-1] = الناتج[موقع1+موقع2-1]^أس_جي(لوغاريتم_جي(كثير1[موقع1])+لوغاريتم_جي(كثير2[موقع2]))
		دور 
	دور 
	مرر الناتج 
	
# كثير حدود Reed-Solomon المولِّد.
دالة كثير_حدود_المولّد(عدد_رموز_التكافؤ)

	لو islist($ذاكرة_مولّد_rs[عدد_رموز_التكافؤ]) مرر $ذاكرة_مولّد_rs[عدد_رموز_التكافؤ] تم 
	المولّد = [1]
	من موقع = 0 إلى عدد_رموز_التكافؤ-1
		المولّد = ضرب_كثيرات_الحدود(المولّد, [1, $جدول_الأسس[موقع+1]])
	دور 
	$ذاكرة_مولّد_rs[عدد_رموز_التكافؤ] = المولّد 
	مرر المولّد 
	
# رموز التكافؤ لكتلة واحدة.
دالة ترميز_رييد_سولومون(البيانات, عدد_رموز_التكافؤ)

	المولّد = كثير_حدود_المولّد(عدد_رموز_التكافؤ)
	طول_البيانات_عدد = len(البيانات)
	طول_المولّد = len(المولّد)
	طول_الرسالة = طول_البيانات_عدد+عدد_رموز_التكافؤ 
	الرسالة = list(طول_الرسالة)
	من موقع = 1 إلى طول_البيانات_عدد الرسالة[موقع] = البيانات[موقع] دور 
	من موقع = طول_البيانات_عدد+1 إلى طول_الرسالة الرسالة[موقع] = 0 دور 
	من موقع = 1 إلى طول_البيانات_عدد 
		المعامل = الرسالة[موقع]
		لو المعامل != 0
			من موقع_المولّد = 1 إلى طول_المولّد 
				الهدف = موقع+موقع_المولّد-1
				لو الهدف <= طول_الرسالة 
					الرسالة[الهدف] = الرسالة[الهدف]^أس_جي(لوغاريتم_جي(المولّد[موقع_المولّد])+لوغاريتم_جي(المعامل))
				تم 
			دور 
		تم 
	دور 
	التكافؤ = []
	من موقع = طول_البيانات_عدد+1 إلى طول_الرسالة add(التكافؤ, الرسالة[موقع]) دور 
	مرر التكافؤ 
	
# يقسّم البيانات إلى كتل ويشابكها.
دالة إنشاء_البايتات(المخزن, كتل_rs)

	طول_المخزن_عدد = len(المخزن[:buffer])
	بايتات_المخزن = []
	من موقع = 1 إلى طول_المخزن_عدد add(بايتات_المخزن, المخزن[:buffer][موقع]) دور 
	مؤشر = 1
	بيانات_الكتل = []
	تكافؤ_الكتل = []
	من كتلة في كتل_rs 
		عدد_كلمات_البيانات = كتلة[2]
		عدد_الكلمات_الإجمالي = كتلة[1]
		عدد_رموز_التكافؤ = عدد_الكلمات_الإجمالي-عدد_كلمات_البيانات 
		بيانات_الكتلة = []
		من موقع = 1 إلى عدد_كلمات_البيانات 
			لو مؤشر <= طول_المخزن_عدد add(بيانات_الكتلة, بايتات_المخزن[مؤشر]) مؤشر++ لا add(بيانات_الكتلة, 0) تم 
		دور 
		add(بيانات_الكتل, بيانات_الكتلة)
		add(تكافؤ_الكتل, ترميز_رييد_سولومون(بيانات_الكتلة, عدد_رموز_التكافؤ))
	دور 
	المشابَك = []
	أقصى_طول_بيانات = 0
	أقصى_طول_تكافؤ = 0
	عدد_كتل_البيانات = len(بيانات_الكتل)
	عدد_كتل_التكافؤ = len(تكافؤ_الكتل)
	من موقع = 1 إلى عدد_كتل_البيانات 
		لو len(بيانات_الكتل[موقع]) > أقصى_طول_بيانات أقصى_طول_بيانات = len(بيانات_الكتل[موقع]) تم 
		لو len(تكافؤ_الكتل[موقع]) > أقصى_طول_تكافؤ أقصى_طول_تكافؤ = len(تكافؤ_الكتل[موقع]) تم 
	دور 
	من موقع = 1 إلى أقصى_طول_بيانات 
		من رقم_الكتلة = 1 إلى عدد_كتل_البيانات 
			لو موقع <= len(بيانات_الكتل[رقم_الكتلة]) add(المشابَك, بيانات_الكتل[رقم_الكتلة][موقع]) تم 
		دور 
	دور 
	من موقع = 1 إلى أقصى_طول_تكافؤ 
		من رقم_الكتلة = 1 إلى عدد_كتل_التكافؤ 
			لو موقع <= len(تكافؤ_الكتل[رقم_الكتلة]) add(المشابَك, تكافؤ_الكتل[رقم_الكتلة][موقع]) تم 
		دور 
	دور 
	مرر المشابَك 
	
# يجرّب الأقنعة الثمانية ويحتفظ بأقلها جزاءً.
دالة أفضل_نمط_قناع()

	إنشاء_القاعدة()
	أقل_جزاء = 0
	أفضل_نمط = 0
	من رقم_القناع = 0 إلى 7
		$الوحدات = value($قاعدة_الوحدات)
		إعداد_معلومات_النوع(1, رقم_القناع)
		خريطة_البيانات($ذاكرة_البيانات, رقم_القناع)
		الجزاء = نقاط_الخسارة()
		لو رقم_القناع = 0 || أقل_جزاء > الجزاء 
			أقل_جزاء = الجزاء 
			أفضل_نمط = رقم_القناع 
		تم 
	دور 
	مرر أفضل_نمط 
	
# جزاء الشبكة وفق قواعد المعيار الأربع.
دالة نقاط_الخسارة()

	الجزاء = 0
	عدد_الوحدات_المحلي = $عدد_الوحدات 
	من الصف = 0 إلى عدد_الوحدات_المحلي-1
		من العمود = 0 إلى عدد_الوحدات_المحلي-1
			عدد_المتشابهة = 0
			داكنة = $الوحدات[الصف+1][العمود+1] = 1 
			من إزاحة_الصف = -1 إلى 1
				من إزاحة_العمود = -1 إلى 1
					لو الصف+إزاحة_الصف >= 0 && الصف+إزاحة_الصف < عدد_الوحدات_المحلي && 
						العمود+إزاحة_العمود >= 0 && العمود+إزاحة_العمود < عدد_الوحدات_المحلي && 
						! (إزاحة_الصف = 0 && إزاحة_العمود = 0)
						لو داكنة = ($الوحدات[الصف+إزاحة_الصف+1][العمود+إزاحة_العمود+1] = 1) عدد_المتشابهة++ تم 
					تم 
				دور 
			دور 
			لو عدد_المتشابهة > 5 الجزاء += (3+عدد_المتشابهة-5) تم 
		دور 
	دور 
	من الصف = 0 إلى عدد_الوحدات_المحلي-2
		من العمود = 0 إلى عدد_الوحدات_المحلي-2
			عدد_الداكنة_في_الكتلة = 0
			لو $الوحدات[الصف+1][العمود+1] = 1 عدد_الداكنة_في_الكتلة++ تم 
			لو $الوحدات[الصف+2][العمود+1] = 1 عدد_الداكنة_في_الكتلة++ تم 
			لو $الوحدات[الصف+1][العمود+2] = 1 عدد_الداكنة_في_الكتلة++ تم 
			لو $الوحدات[الصف+2][العمود+2] = 1 عدد_الداكنة_في_الكتلة++ تم 
			لو عدد_الداكنة_في_الكتلة = 0 || عدد_الداكنة_في_الكتلة = 4 الجزاء += 3 تم 
		دور 
	دور 
	من الصف = 0 إلى عدد_الوحدات_المحلي-1
		من العمود = 0 إلى عدد_الوحدات_المحلي-7
			لو $الوحدات[الصف+1][العمود+1] = 1 && ! ($الوحدات[الصف+1][العمود+2] = 1) && $الوحدات[الصف+1][العمود+3] = 1 && 
				$الوحدات[الصف+1][العمود+4] = 1 && $الوحدات[الصف+1][العمود+5] = 1 && ! ($الوحدات[الصف+1][العمود+6] = 1) && $الوحدات[الصف+1][العمود+7] = 1 
				الجزاء += 40
			تم 
		دور 
	دور 
	من العمود = 0 إلى عدد_الوحدات_المحلي-1
		من الصف = 0 إلى عدد_الوحدات_المحلي-7
			لو $الوحدات[الصف+1][العمود+1] = 1 && ! ($الوحدات[الصف+2][العمود+1] = 1) && $الوحدات[الصف+3][العمود+1] = 1 && 
				$الوحدات[الصف+4][العمود+1] = 1 && $الوحدات[الصف+5][العمود+1] = 1 && ! ($الوحدات[الصف+6][العمود+1] = 1) && $الوحدات[الصف+7][العمود+1] = 1 
				الجزاء += 40
			تم 
		دور 
	دور 
	عدد_الداكنة = 0
	من الصف = 0 إلى عدد_الوحدات_المحلي-1
		من العمود = 0 إلى عدد_الوحدات_المحلي-1
			لو $الوحدات[الصف+1][العمود+1] = 1 عدد_الداكنة++ تم 
		دور 
	دور 
	النسبة = 100*عدد_الداكنة/عدد_الوحدات_المحلي/عدد_الوحدات_المحلي-50
	لو النسبة < 0 النسبة = -النسبة تم 
	الجزاء += (النسبة/5)*10
	مرر الجزاء 
	
# هل الوحدة داكنة.
دالة هل_داكنة(الصف, العمود)

	لو الصف < 0 || $عدد_الوحدات <= الصف || العمود < 0 || $عدد_الوحدات <= العمود مرر 0 تم 
	لو isnull($الوحدات[الصف+1][العمود+1]) مرر 0 تم 
	مرر $الوحدات[الصف+1][العمود+1]
	
# يرسم الرمز كمسار SVG واحد.
دالة إنشاء_svg(حجم_الخلية_المطلوب, الهامش)

	لو isnull(حجم_الخلية_المطلوب) حجم_الخلية_المطلوب = 2 تم 
	لو isnull(الهامش) الهامش = حجم_الخلية_المطلوب*4 تم 
	الحجم = $عدد_الوحدات*حجم_الخلية_المطلوب+الهامش*2
	شكل_المستطيل = "l"+حجم_الخلية_المطلوب+",0 0,"+حجم_الخلية_المطلوب+" -"+حجم_الخلية_المطلوب+",0 0,-"+حجم_الخلية_المطلوب+"z "
	نتيجة_svg = '<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="'+الحجم+'" height="'+الحجم+'" viewBox="0 0 '+الحجم+" "+الحجم+'">'
	نتيجة_svg += '<rect width="100%" height="100%" fill="white"/>'
	نتيجة_svg += '<path d="'
	من الصف = 0 إلى $عدد_الوحدات-1
		بكسل_الصف = الصف*حجم_الخلية_المطلوب+الهامش 
		من العمود = 0 إلى $عدد_الوحدات-1
			لو هل_داكنة(الصف, العمود)
				بكسل_العمود = العمود*حجم_الخلية_المطلوب+الهامش 
				نتيجة_svg += "M"+بكسل_العمود+","+بكسل_الصف+شكل_المستطيل 
			تم 
		دور 
	دور 
	نتيجة_svg += '" fill="black"/></svg>'
	مرر نتيجة_svg 
	
# يفحص النص مقابل النمط المطلوب ويوسّع النمط لو لم يتّسع.
دالة فحص_النمط_وإصلاحه(النص, النمط)

	لو upper(النمط) = "تلقائي"
		مرر الكشف_الذكي(النص)
	تم 
	لو النمط = "Numeric"
		لو ! isdigit(النص)
			add($التحذيرات, "تحذير: النص يحتوي على محارف غير رقمية. تبديل النمط تلقائيًا...")
			لو صالح_لأبجدية_qr(النص)
				مرر "AlphaNum"
			لا 
				مرر "Byte"
			تم 
		تم 
	إذا النمط = "AlphaNum"
		لو ! صالح_لأبجدية_qr(النص)
			add($التحذيرات, "تحذير: النص يحتوي على محارف لا يدعمها AlphaNum. التحويل إلى Byte.")
			مرر "Byte"
		تم 
	تم 
	مرر النمط 
	
# النمط الذي يضغط النص كله بأكبر كثافة.
دالة الكشف_الذكي(النص)

	لو isdigit(النص) مرر "Numeric" تم 
	لو صالح_لأبجدية_qr(النص) مرر "AlphaNum" تم 
	مرر "Byte"
	
# هل كل محارف النص في أبجدية AlphaNum.
دالة صالح_لأبجدية_qr(النص)

	المحارف_الصالحة = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:"
	طول_النص = len(النص)
	من رقم_الموضع = 1 إلى طول_النص 
		لو ! substr(المحارف_الصالحة, النص[رقم_الموضع]) مرر 0 تم 
	دور 
	مرر 1 
	
# يرسم الرمز بمحارف الكتل.
دالة إنشاء_ascii(حجم_الخلية_المطلوب, الهامش)

	النتيجة = ""
	خلايا_الهامش = ceil(الهامش/حجم_الخلية_المطلوب)
	هامش_المحارف = خلايا_الهامش*2
	العرض_الإجمالي = ($عدد_الوحدات+خلايا_الهامش*2)*2
	من رقم_صف_الهامش = 1 إلى خلايا_الهامش النتيجة += copy(" ", العرض_الإجمالي)+nl دور 
	من الصف = 1 إلى $عدد_الوحدات 
		السطر = copy(" ", هامش_المحارف)
		من العمود = 1 إلى $عدد_الوحدات 
			لو $الوحدات[الصف][العمود] السطر += "██" لا السطر += "  " تم 
		دور 
		النتيجة += السطر+copy(" ", هامش_المحارف)+nl 
	دور 
	من رقم_صف_الهامش = 1 إلى خلايا_الهامش النتيجة += copy(" ", العرض_الإجمالي)+nl دور 
	مرر النتيجة 
	
# الوحدات كنص.
دالة إنشاء_المصفوفة(حجم_الخلية_المطلوب, الهامش)

	النتيجة = ""
	خلايا_الهامش = ceil(الهامش/حجم_الخلية_المطلوب)
	هامش_المحارف = خلايا_الهامش*2
	العرض_الإجمالي = ($عدد_الوحدات+خلايا_الهامش*2)*2
	من رقم_صف_الهامش = 1 إلى خلايا_الهامش النتيجة += copy(" ", العرض_الإجمالي)+nl دور 
	من الصف = 1 إلى $عدد_الوحدات 
		السطر = copy(" ", هامش_المحارف)
		من العمود = 1 إلى $عدد_الوحدات 
			لو $الوحدات[الصف][العمود] السطر += "1 " لا السطر += "0 " تم 
		دور

نقطة الدخول الرئيسية. تملأ الوسائط المتروكة من العموميات، وتستقرّ على النمط، وتبني الرمز مرة واحدة، ثم تنتج الأجزاء المطلوبة فقط.

|--------|------|-------|

| \`الأجزاء_المطلوبة\` | قائمة | \`"svg"\`, \`"ascii"\`, \`"matrix"\`, \`"stats"\`, \`"info"\` |

**القيمة المرجعة:** قاموس (Hash) بمفتاح لكل جزء مطلوب.

\`\`\`ض

### \`إنشاء_البيانات(رقم_الإصدار, مستوى_الأخطاء)\`

يبني مجرى الكلمات المشفّرة النهائي:

1. يرمّز كل مقاطع البيانات.
2. يضيف البتات المنهية \`0000\` (إن اتّسعت).
3. يحشو إلى حد بايت.
4. يبدّل بين \`$حشو0\` و \`$حشو1\` حتى سعة الإصدار.

يرجع \`[]\` إذا لم تتّسع البيانات.

### \`إنشاء_البايتات(المخزن, كتل_rs)\`

يقسّم البيانات إلى كتل، ويحسب تكافؤ كل كتلة بـ Reed-Solomon، ثم **يشابك** الكتل:

\`\`\`
[ب1ك1, ب2ك1, ب3ك1, ...] [ب1ك2, ب2ك2, ...] ... [تك1ك1, تك2ك1, ...] ...
\`\`\`

التشابك يوزّع التلف: خدش يدمّر كتلة كاملة يأخذ كلمة واحدة من كل كتلة.

---

### \`كثير_حدود_المولّد(عدد_رموز_التكافؤ)\`

يبني كثير الحدود المولِّد كحاصل ضرب \`(x - α^i)\` لـ \`i = 0..عدد-1\`. مُخزَّن في \`$ذاكرة_مولّد_rs\`.

---

### \`ضرب_كثيرات_الحدود(كثير1, كثير2)\`

يضرب كثيرَي حدود في GF(256). الضرب يصبح جمعًا للوغاريتمات.

---

## دوال بناء الشبكة

### \`تهيئة_الوحدات()\`

ينشئ شبكة فارغة بحجم \`4 × الإصدار + 17\` لكل ضلع، ثم يضع الأنماط الثابتة:

- 3 محددات في الأركان.
- أنماط المحاذاة.
- سطور التوقيت.

---

### \`إنشاء_القاعدة()\`

يبني الرمز **بلا بيانات ولا قناع**، ويحفظه في \`$قاعدة_الوحدات\` ليبدأ منه كل الأقنعة.

---

### \`إنشاء_النمط(اختبار, نمط_القناع)\`

يبني الرمز كاملًا بقناع معيّن. في نمط الاختبار تُكتب معلمات المعلومات ببتات تشير إلى تجربة.

---

### \`إعداد_نمط_المحدد(الصف, العمود)\`

يضع نمط محدد واحد (مربع 7×7) عند ركن، مع فاصل بسماكة وحدة.

---

### \`إعداد_نمط_المحاذاة()\`

يضع أنماط المحاذاة (5×5) عند تقاطعات جدول الإصدار، فقط حيث لا يوجد محدد.

---

### \`إعداد_نمط_التوقيت()\`

يرسم سطري التوقيت (صف وعمود متبادلان) بين المحددات.

---

### \`إعداد_رقم_النوع(اختبار)\`

يكتب معلمات الإصدار (18 بتة) في الموضعين المخصّصين. الإصدار 7 وما فوق فقط.

---

### \`إعداد_معلومات_النوع(اختبار, نمط_القناع)\`

يكتب معلمات المعلومات (15 بتة) في الموضعين المخصّصين، بالإضافة إلى الوحدة الداكنة الدائمة.

---

### \`خريطة_البيانات(البيانات, نمط_القناع)\`

يكتب البتات في الشبكة على المسار القياسي:

- عمودان في المرة من أسفل اليمين.
- صعود زوج أعمدة، نزول التالي.
- تجاوز الوحدات المشغولة والعمود 6 (التوقيت العمودي).

---

### \`هل_داكنة(الصف, العمود)\`

ترجع \`1\` إذا كانت الوحدة داكنة. أي موضع خارج الشبكة أو غير مضبوط يُعدّ فاتحًا.

---

## دوال تقييم الجزاء والقناع

### \`أفضل_نمط_قناع()\`

يجرّب الأقنعة الثمانية على الشبكة الأساسية ويحتفظ بأقلها جزاءً.

**القيمة المرجعة:** رقم القناع من 0 إلى 7.

---

### \`نقاط_الخسارة()\`

يحسب جزاء الشبكة الحالية وفق قواعد المعيار الأربع:

1. **سلاسل من 5 وحدات متساوية أو أكثر** في صف أو عمود.
2. **كتل 2×2 بلون واحد**.
3. **نمط 1:1:3:1:1** الذي يحاكي محددًا (يُضاف 40).
4. **انحراف نسبة الوحدات الداكنة عن 50%**.

النتيجة: **الأقل أفضل**.

---

## دوال الإخراج

### \`إنشاء_svg(حجم_الخلية, الهامش)\`

يرسم الرمز كمسار SVG واحد بمسار فرعي نسبي لكل وحدة داكنة. الحجم أصغر بكثير من مستطيل لكل وحدة.

**المعاملات:**

- \`حجم_الخلية\`: ضلع الوحدة بالبكسل (افتراضي: 2).
- \`الهامش\`: المنطقة الهادئة (افتراضي: \`4 × حجم_الخلية\`).

---

### \`إنشاء_ascii(حجم_الخلية, الهامش)\`

يرسم الرمز بمحارف الكتل \`█\` (اثنان لكل وحدة ليبقى مربعًا).

---

### \`إنشاء_المصفوفة(حجم_الخلية, الهامش)\`

يرسم الرمز كنص: \`"1 "\` للوحدة الداكنة و \`"0 "\` للفاتحة، مع المنطقة الهادئة.

---

## المتغيرات العمومية

### الافتراضات

| المتغير | القيمة الافتراضية | الوصف |
|---------|-------------------|-------|
| \`$النص\` | \`"Hello World!"\` | النص الافتراضي |
| \`$نمط_الترميز\` | \`"Numeric"\` | النمط الافتراضي |
| \`$تصحيح_الخطأ\` | \`"L"\` | مستوى تصحيح الأخطاء |
| \`$حجم_الخلية\` | \`4\` | حجم الوحدة بالبكسل |
| \`$المنطقة_الهادئة\` | \`16\` | الهامش بالبكسل |
| \`$الإحصاءات\` | \`1\` | طباعة الإحصاءات عند التشغيل المباشر |

### الجداول الثابتة

| المتغير | الوصف |
|---------|-------|
| \`$قائمة_الأنماط\` | رموز الأنماط الثلاثة (Numeric=1, AlphaNum=2, Byte=4) |
| \`$قائمة_تبديل_مستوى_تصحيح_الخطأ\` | تبديل مستويات L/M/Q/H إلى قيم المعيار |
| \`$جدول_كتل_رييد_سولومون\` | جدول تخطيط الكتل لكل إصدار ومستوى |
| \`$جدول_الأسس\` | أسس GF(256) (256 عنصر) |
| \`$جدول_اللوغاريتمات\` | لوغاريتمات GF(256) (256 عنصر) |
| \`$ذاكرة_مولّد_rs\` | تخزين مؤقت لكثيرات الحدود المولِّدة |

### حالة الرمز الجاري بناؤه

| المتغير | الوصف |
|---------|-------|
| \`$الوحدات\` | الشبكة الحالية (قائمة من قوائم) |
| \`$قاعدة_الوحدات\` | الشبكة الأساسية بلا بيانات |
| \`$عدد_الوحدات\` | ضلع الشبكة بالوحدات |
| \`$رقم_الإصدار\` | الإصدار المختار (1–40) |
| \`$تبديل_مستوى_تصحيح_الخطأ\` | القيمة المبدّلة للمستوى |
| \`$قائمة_البيانات\` | مقاطع البيانات المُضافة |
| \`$ذاكرة_البيانات\` | ذاكرة مؤقتة للكلمات المشفّرة |
| \`$أفضل_نمط_قناع\` | القناع المختار (0–7) |
| \`$التحذيرات\` | قائمة التحذيرات المُسجّلة |
| \`$حشو0\`, \`$حشو1\` | بايتا الحشو \`0xEC\` و \`0x11\` |
| \`$فهرس_الحلقة\` | مؤشر حلقة عام لتفادي التعارض مع المستدعي |

1. **التحذيرات** لا تُطبع تلقائيًا. اقرأها من \`r[:info][:warnings]\`.
2. **الوسائط المتروكة** تُملأ من العموميات تلقائيًا، لذا يمكن استدعاء الدالة ببعض الوسائط فقط.
3. **الترتيب مهم** في \`الأجزاء_المطلوبة\`: كل جزء يُبنى مرة واحدة ويُخزَّن في القاموس الناتج.
4. **حجم الخلية** لا يؤثر على البيانات، فقط على حجم المخرجات الرسومية.
5. **الهامش** يجب أن يكون ≥ 4 وحدات (وفق المعيار) للقراءة الصحيحة، والمكتبة لا تفرض ذلك.

/*
========================================================
                    جميع الملفات
========================================================

يبدأ النظام بالملفات الافتراضية.

ثم تضاف ملفات المستخدم إليها.

========================================================
*/

let files = [...defaultFiles];



/*
========================================================
                    الملف الحالي
========================================================
*/

let currentFileIndex = 0;



/*
========================================================
                    عناصر الصفحة
========================================================
*/

const fileInput =
    document.getElementById("fileInput");


const filesList =
    document.getElementById("filesList");


const fileContentDisplay =
    document.getElementById(
        "fileContentDisplay"
    );


const filenameDisplay =
    document.getElementById(
        "filenameDisplay"
    );


const statusMessageElement =
    document.getElementById(
        "statusMessage"
    );


const filesInfo =
    document.getElementById(
        "filesInfo"
    );



/*
========================================================
                    تشغيل الصفحة
========================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderFilesList();

        selectFile(0);

    }
);



/*
========================================================
                    إضافة ملفات
========================================================
*/

fileInput.addEventListener(
    "change",
    async function(event) {


        const selectedFiles =
            Array.from(
                event.target.files
            );


        if (
            selectedFiles.length === 0
        ) {

            return;

        }


        let addedCount = 0;


        for (
            const file
            of selectedFiles
        ) {


            try {


                /*
                قراءة الملف كنص
                */

                const content =
                    await file.text();


                /*
                البحث عن ملف بنفس الاسم
                */

                const existingIndex =
                    files.findIndex(
                        function(item) {

                            return (
                                item.name ===
                                file.name
                            );

                        }
                    );


                /*
                إذا كان الملف موجودًا
                نستبدل محتواه
                */

                if (
                    existingIndex !== -1
                ) {


                    files[
                        existingIndex
                    ] = {

                        name:
                            file.name,

                        content:
                            content,

                        userFile:
                            true

                    };


                }


                /*
                إذا كان ملفًا جديدًا
                */

                else {


                    files.push({

                        name:
                            file.name,

                        content:
                            content,

                        userFile:
                            true

                    });

                }


                addedCount++;


            }


            catch (error) {


                console.error(
                    error
                );


                showStatusMessage(
                    "تعذر قراءة الملف: " +
                    file.name
                );

            }

        }


        /*
        تحديث القائمة
        */

        renderFilesList();


        /*
        تحديد آخر ملف
        */

        if (
            addedCount > 0
        ) {


            const lastFile =
                selectedFiles[
                    selectedFiles.length - 1
                ];


            const index =
                files.findIndex(
                    function(item) {

                        return (
                            item.name ===
                            lastFile.name
                        );

                    }
                );


            if (index !== -1) {

                selectFile(index);

            }

        }


        showStatusMessage(
            "تمت إضافة " +
            addedCount +
            " ملف بنجاح!"
        );


        /*
        السماح باختيار نفس الملف
        مرة أخرى
        */

        fileInput.value = "";

    }
);



/*
========================================================
                    رسم قائمة الملفات
========================================================
*/

function renderFilesList() {


    filesList.innerHTML = "";


    if (
        files.length === 0
    ) {


        filesList.innerHTML =
            '<div class="empty-message">' +
            'لا توجد ملفات' +
            '</div>';


        return;

    }


    files.forEach(
        function(file, index) {


            const fileButton =
                document.createElement(
                    "div"
                );


            fileButton.className =
                "file-item";


            /*
            الملف المحدد
            */

            if (
                index ===
                currentFileIndex
            ) {

                fileButton.classList.add(
                    "active"
                );

            }


            /*
            ملفات default
            */

            if (
                index <
                defaultFiles.length
            ) {

                fileButton.classList.add(
                    "default-file"
                );

            }


            /*
            الأيقونة
            */

            const icon =
                document.createElement(
                    "i"
                );


            if (
                isMarkdownFile(
                    file.name
                )
            ) {

                icon.className =
                    "fab fa-markdown";

            }

            else {

                icon.className =
                    "fas fa-file-code";

            }


            /*
            اسم الملف
            */

            const name =
                document.createElement(
                    "span"
                );


            name.textContent =
                file.name;


            fileButton.appendChild(
                icon
            );


            fileButton.appendChild(
                name
            );


            /*
            عند الضغط
            */

            fileButton.onclick =
                function() {

                    selectFile(index);

                };


            filesList.appendChild(
                fileButton
            );

        }
    );


    /*
    حساب عدد الملفات
    */

    const defaultCount =
        Math.min(
            defaultFiles.length,
            files.length
        );


    const addedCount =
        Math.max(
            0,
            files.length -
            defaultCount
        );


    filesInfo.textContent =
        "الافتراضية: " +
        defaultCount +
        " | المضافة: " +
        addedCount +
        " | المجموع: " +
        files.length;

}



/*
========================================================
                    اختيار الملف
========================================================
*/

function selectFile(index) {


    if (
        !files[index]
    ) {

        return;

    }


    currentFileIndex =
        index;


    const file =
        files[index];


    /*
    اسم الملف
    */

    filenameDisplay.textContent =
        "اسم الملف: " +
        file.name;


    /*
    Markdown
    */

    if (
        isMarkdownFile(
            file.name
        )
    ) {


        fileContentDisplay.classList.add(
            "markdown-preview"
        );


        /*
        التأكد أن marked موجودة
        */

        if (
            typeof marked !==
            "undefined"
        ) {


            fileContentDisplay.innerHTML =
                marked.parse(
                    file.content
                );


        }


        else {


            fileContentDisplay.textContent =
                file.content;

        }

    }


    /*
    ملفات عادية
    */

    else {


        fileContentDisplay.classList.remove(
            "markdown-preview"
        );


        fileContentDisplay.textContent =
            file.content;

    }


    /*
    إعادة رسم القائمة
    */

    renderFilesList();

}



/*
========================================================
                    هل الملف Markdown؟
========================================================
*/

function isMarkdownFile(
    filename
) {


    const name =
        filename.toLowerCase();


    return (
        name.endsWith(".md") ||
        name.endsWith(".markdown") ||
        name.endsWith(".ضوء") 
    );

}



/*
========================================================
                    نسخ المحتوى
========================================================
*/

async function copyContent() {


    const file =
        files[currentFileIndex];


    if (!file) {

        return;

    }


    try {


        /*
        نسخ النص الأصلي
        وليس HTML
        */

        await navigator.clipboard.writeText(
            file.content
        );


        showStatusMessage(
            "تم نسخ محتوى " +
            file.name +
            " بنجاح!"
        );


    }


    catch (error) {


        console.error(
            error
        );


        /*
        طريقة احتياطية
        */

        try {


            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                file.content;


            textarea.style.position =
                "fixed";


            textarea.style.opacity =
                "0";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            document.body.removeChild(
                textarea
            );


            showStatusMessage(
                "تم نسخ المحتوى بنجاح!"
            );


        }


        catch (e) {


            showStatusMessage(
                "فشل في نسخ المحتوى."
            );

        }

    }

}



/*
========================================================
                    تنزيل الملف
========================================================
*/

function downloadFile() {


    const file =
        files[currentFileIndex];


    if (!file) {

        return;

    }


    const blob =
        new Blob(
            [
                file.content
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        file.name;


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    URL.revokeObjectURL(
        url
    );


    showStatusMessage(
        "جاري تنزيل " +
        file.name +
        "..."
    );

}



/*
========================================================
              حذف الملفات المضافة
========================================================

لا نحذف defaultFiles.

نرجع فقط إلى الملفات الافتراضية.

========================================================
*/

function clearAddedFiles() {


    files =
        [...defaultFiles];


    currentFileIndex =
        0;


    renderFilesList();


    selectFile(0);


    showStatusMessage(
        "تم حذف الملفات المضافة."
    );

}



/*
========================================================
                    رسالة الحالة
========================================================
*/

function showStatusMessage(
    message
) {


    statusMessageElement.textContent =
        message;


    statusMessageElement.style.display =
        "block";


    setTimeout(
        function() {

            statusMessageElement.style.display =
                "none";

        },
        3000
    );

}


</script>
